---
layout: default
---
<article class="post container prose">
  <header class="post-header">
    <div class="eyebrow">From the lab</div>
    <h1>{{ page.title }}</h1>
    {% if page.description %}<p class="post-lead">{{ page.description }}</p>{% endif %}
    <div class="post-meta">
      <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time>
      {% if page.categories %}<span>·</span><span>{{ page.categories | join: " · " }}</span>{% endif %}
    </div>
  </header>
  {{ content }}
</article>
